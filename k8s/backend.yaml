apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-backend
  namespace: rca-agent
  labels: {app: rca-backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: rca-backend}
  template:
    metadata:
      labels: {app: rca-backend}
    spec:
      serviceAccountName: rca-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: ghcr.io/singhgauravlinux-coder/rca-agent-backend:latest   # replaced by kustomize images:
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: {name: rca-gemini, key: GEMINI_API_KEY}
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: MAX_CONTEXT_CHARS
              value: "60000"
            # - name: ALLOWED_NAMESPACES      # restrict what can be analysed
            #   value: "payments,checkout"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: rca-backend
  namespace: rca-agent
spec:
  selector: {app: rca-backend}
  ports: [{name: http, port: 8000, targetPort: http}]
