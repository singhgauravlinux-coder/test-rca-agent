# Strictly read-only: the agent can look, never touch.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rca-backend
  namespace: rca-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rca-agent-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rca-agent-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rca-agent-reader
subjects:
  - kind: ServiceAccount
    name: rca-backend
    namespace: rca-agent
